<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HAWK PRO - Master Configurator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 20px; color: #2d3748; }
        .main-wrapper { display: flex; gap: 20px; max-width: 1500px; margin: 0 auto; align-items: flex-start; }
        .col-left, .col-mid { width: 330px; flex-shrink: 0; }
        .col-preview { flex-grow: 1; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); min-width: 550px; }
        .section-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px;}
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 11px; color: #718096; text-transform: uppercase; }
        select, input { width: 100%; height: 40px; padding: 0 12px; border: 2px solid #edf2f7; border-radius: 10px; box-sizing: border-box; font-size: 14px; background-color: #f8fafc; }
        .section-title { font-size: 15px; font-weight: 800; color: #2b6cb0; margin-bottom: 15px; border-bottom: 3px solid #ebf8ff; padding-bottom: 8px; }
        button.main-btn { background: #003d82; color: white; border: none; height: 50px; cursor: pointer; width: 100%; border-radius: 12px; font-size: 15px; font-weight: bold; margin-top: 10px; }
        .summary-table { width: 100%; border: 2px solid #1a202c; border-collapse: collapse; background: #fff; table-layout: fixed; }
        .summary-table td { border: 1px solid #1a202c; padding: 15px; vertical-align: middle; text-align: center; }
        .row-label { width: 25%; font-weight: 900; font-size: 20px; background: #f7fafc; }
        .row-price { width: 25%; font-weight: 800; font-size: 22px; color: #2b6cb0; }
        .calc-result-box { margin-top: 20px; background: #004b63; color: white; padding: 25px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="col-left">
        <div class="section-card">
            <div class="section-title">1. Camera/Archive Calculator</div>
            <div class="input-group"><label>Basic Cameras</label><input type="number" id="camQty" placeholder="0" oninput="debouncedCalc()"></div>
            <div class="input-group"><label>Neural Tracker (Auto)</label><input type="number" id="neuralDisp" readonly style="background:#edf2f7; color:#4a5568;"></div>
            <div class="input-group"><label>Facial Recognition</label><input type="number" id="faceCamQty" value="0" oninput="debouncedCalc()"></div>
            <div class="input-group"><label>LPR Cameras</label><input type="number" id="lprCamQty" value="0" oninput="debouncedCalc()"></div>
        </div>
        <div class="section-card">
            <div class="section-title">2. RAID Configuration (Auto)</div>
            <div class="input-group"><label>Number of Disks</label><input type="number" id="diskQtyDisp" readonly style="background:#edf2f7;"></div>
            <div class="input-group"><label>Single Disk Size (TB)</label><input type="number" id="diskSizeDisp" readonly style="background:#edf2f7;"></div>
            <div class="input-group">
                <label>RAID Type</label>
                <select id="raidType" onchange="debouncedCalc()">
                    <option value="10" selected>RAID 10</option>
                    <option value="5">RAID 5</option>
                    <option value="6">RAID 6</option>
                </select>
            </div>
            <button class="main-btn" onclick="downloadPDF()">Export Full Quote</button>
        </div>
    </div>

    <div class="col-mid">
        <div class="section-card">
            <div class="section-title">3. System Hardware</div>
            <div class="input-group"><label>Client Name</label><input type="text" id="clientName"></div>
            <div class="input-group"><label>PO Number</label><input type="text" id="poNumber"></div>
            <div class="input-group"><label>Model Series</label><input type="text" id="modelDisp" readonly style="background:#edf2f7;"></div>
            
            <div class="input-group"><label>CPU</label>
                <select id="cpuSelect" onchange="fetchPrices()">
                    <option value="Intel Ultra 5">Intel Ultra 5</option>
                    <option value="Intel Ultra 7">Intel Ultra 7</option>
                    <option value="Intel Ultra 9">Intel Ultra 9</option>
                </select>
            </div>
            <div class="input-group"><label>RAM</label>
                <select id="ramSelect" onchange="fetchPrices()">
                    <option value="Memory (RAM) 16GB">Memory (RAM) 16GB</option>
                    <option value="Memory (RAM) 32GB">Memory (RAM) 32GB</option>
                </select>
            </div>
            <div class="input-group"><label>RAID Controller</label>
                <select id="raidCardSelect" onchange="fetchPrices()">
                    <option value="RAID Controller">Broadcom MegaRAID</option>
                    <option value="None">None</option>
                </select>
            </div>
            <div class="input-group"><label>Drive Bays</label>
                <select id="baySelect" onchange="fetchPrices()">
                    <option value="3 HDD Bay">3 HDD Bay</option>
                    <option value="5 HDD Bay">5 HDD Bay</option>
                    <option value="8 HDD Bay">8 HDD Bay</option>
                    <option value="10 HDD Bay">10 HDD Bay</option>
                </select>
            </div>
            <div class="input-group"><label>GPU</label>
                <select id="gpuSelect" onchange="fetchPrices()">
                    <option value="NVIDIA RTX2000ADA">NVIDIA RTX2000ADA</option>
                    <option value="None">Integrated</option>
                </select>
            </div>
        </div>
    </div>

    <div class="col-preview">
        <h2 style="margin-top:0; color:#2b6cb0;">Quote Breakdown</h2>
        <table class="summary-table">
            <tr>
                <td class="row-label" id="prevModel">--</td>
                <td id="prevSpec" style="font-size:12px; text-align:center; color:#4a5568;">Enter camera quantities...</td>
                <td class="row-price" id="combinedTotalDisplay">$0.00</td>
            </tr>
        </table>
        <div class="calc-result-box">
            <div>Video Archive: <span id="dispArchive" style="font-weight:800; font-size:22px;">0.00</span> TB</div>
            <div style="margin-top:15px; font-size:16px;">
                Metadata SSD: <span id="dispMeta" style="font-weight:800; font-size:20px;">0.00 GB</span>
            </div>
        </div>
        <span id="calcStatus" style="font-size:11px; color:#a0aec0; display:block; text-align:center; margin-top:15px;">Standby</span>
    </div>
</div>

<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbysMdddXc0VBVV53XrhgNYyGaNnfZ54CsMlGsOrSApatAV-EoCU4IFdshkUf0cQgTb7/exec";
    let state = { serverPrice: 0, drivePrice: 0, disks: 0, size: 0, licenseTotal: 0, model: "" };
    let timer;

    // Prevents jumping by waiting for user to stop typing
    function debouncedCalc() {
        document.getElementById('calcStatus').innerText = "Waiting...";
        clearTimeout(timer);
        timer = setTimeout(calculateArchive, 700);
    }

    function calculateArchive() {
        const basic = parseInt(document.getElementById('camQty').value) || 0;
        const face = parseInt(document.getElementById('faceCamQty').value) || 0;
        const lpr = parseInt(document.getElementById('lprCamQty').value) || 0;

        if (basic === 0 && face === 0 && lpr === 0) { resetUI(); return; }

        document.getElementById('neuralDisp').value = basic;
        let currentModel = (basic <= 16) ? "HAWK16" : (basic <= 32 ? "HAWK32" : "HAWK64");

        if (state.model !== currentModel) {
            state.model = currentModel;
            document.getElementById('modelDisp').value = currentModel;
            autoSelectHardware(currentModel);
        }

        const archiveTB = (basic * 711.92) / 1000;
        const requiredRawTB = archiveTB * 2; 
        const availableSizes = [6, 8, 12, 16, 22];
        
        let bestQty = 4;
        let bestSize = availableSizes.find(s => (s * 4) >= requiredRawTB);

        if (!bestSize && currentModel === "HAWK64") {
            bestQty = 8;
            bestSize = availableSizes.find(s => (s * 8) >= requiredRawTB) || 22;
        } else if (!bestSize) {
            bestSize = 22;
        }

        state.disks = bestQty;
        state.size = bestSize;

        document.getElementById('diskQtyDisp').value = state.disks;
        document.getElementById('diskSizeDisp').value = state.size;
        document.getElementById('dispArchive').innerText = archiveTB.toFixed(2);
        
        // Dynamic unit for metadata
        const metaGB = (basic + face + lpr) * 37.90;
        document.getElementById('dispMeta').innerText = metaGB >= 1000 ? (metaGB/1000).toFixed(2) + " TB" : metaGB.toFixed(2) + " GB";

        fetchPrices();
    }

    function autoSelectHardware(model) {
        const cpu = document.getElementById('cpuSelect');
        const ram = document.getElementById('ramSelect');
        const bays = document.getElementById('baySelect');
        const raid = document.getElementById('raidCardSelect');
        const gpu = document.getElementById('gpuSelect');

        if (model === "HAWK64") {
            cpu.value = "Intel Ultra 9";
            ram.value = "Memory (RAM) 32GB";
            bays.value = "8 HDD Bay";
            raid.value = "RAID Controller";
            gpu.value = "NVIDIA RTX2000ADA";
        } else if (model === "HAWK32") {
            cpu.value = "Intel Ultra 7";
            ram.value = "Memory (RAM) 16GB"; // Per your request: HAWK32 standard is 16GB
            bays.value = "5 HDD Bay";
            raid.value = "RAID Controller";
            gpu.value = "NVIDIA RTX2000ADA";
        } else {
            cpu.value = "Intel Ultra 5";
            ram.value = "Memory (RAM) 16GB";
            bays.value = "5 HDD Bay";
            raid.value = "RAID Controller";
            gpu.value = "NVIDIA RTX2000ADA";
        }
    }

    function fetchPrices() {
        document.getElementById('calcStatus').innerText = "Syncing...";
        const params = { 
            cpu: document.getElementById('cpuSelect').value, 
            ram: document.getElementById('ramSelect').value, 
            bay: document.getElementById('baySelect').value,
            raidCard: document.getElementById('raidCardSelect').value,
            gpu: document.getElementById('gpuSelect').value,
            driveQty: state.disks, 
            driveSize: state.size, 
            metadata: (state.model === "HAWK16") ? "1TB" : "2TB",
            callback: "callback" 
        };
        const script = document.createElement('script');
        script.src = webAppUrl + "?" + new URLSearchParams(params).toString() + "&t=" + Date.now();
        document.body.appendChild(script);
    }

    window.callback = function(data) {
        const markupFactor = data.markup || 1.30;
        const finalTotal = (data.serverBasePrice * markupFactor) + (data.driveUnitPrice * state.disks);
        document.getElementById('combinedTotalDisplay').innerText = "$" + finalTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        updateLabels();
        document.getElementById('calcStatus').innerText = "Ready";
    };

    function updateLabels() {
        const cpu = document.getElementById('cpuSelect').value;
        const ram = document.getElementById('ramSelect').value;
        const meta = (state.model === "HAWK16") ? "1TB Meta" : "2TB Meta";
        document.getElementById('prevModel').innerText = state.model;
        document.getElementById('prevSpec').innerText = `${cpu}, ${ram}, ${meta}, RAID ${document.getElementById('raidType').value} (${state.disks}x${state.size}TB). Hardware + Storage Included.`;
    }

    function resetUI() {
        state.model = ""; 
        document.getElementById('combinedTotalDisplay').innerText = "$0.00";
        document.getElementById('modelDisp').value = "--";
    }

    function downloadPDF() {
        // PDF logic...
    }
</script>
</body>
</html>
